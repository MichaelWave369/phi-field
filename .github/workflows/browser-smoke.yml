name: Φ Field Browser Acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate and stage both hosting layouts
        run: |
          python -m unittest discover -s tests -v
          python scripts/package_site.py
      - name: Real Chromium desktop + phone + launch checks
        run: python tests/browser_smoke.py
      - name: PhiOS Web Alpha browser boot acceptance
        run: python tests/browser_web_os.py
      - name: Store screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phi-field-rung3-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 14
