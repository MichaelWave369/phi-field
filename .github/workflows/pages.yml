name: Φ Field GitHub Pages Preview
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages is the public proving ground. Netlify is NEVER deployed here.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: phi-field-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate gateway before release
        run: python -m unittest discover -s tests -v
      - name: Package exactly the static site
        run: python scripts/package_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages only
        id: deployment
        uses: actions/deploy-pages@v4
